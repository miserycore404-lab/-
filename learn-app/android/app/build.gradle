plugins { id "com.android.application" }

android {
    namespace "com.linebyline.app"
    compileSdk 35
    defaultConfig {
        applicationId "com.linebyline.app"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "3.0"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
    }
    // Signing key is kept outside the repo. Set LBL_KEYSTORE / LBL_KEY_PASS to sign; otherwise the debug key is used.
    signingConfigs {
        release {
            def ks = System.getenv("LBL_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("LBL_KEY_PASS")
                keyAlias "linebyline"
                keyPassword System.getenv("LBL_KEY_PASS")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig System.getenv("LBL_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "com.google.mlkit:text-recognition:16.0.1"
}
