<style>
/* Layout: one narrow phone-first column; a top bar, subject chips, then cards. Practice happens in one big "card". */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --sunk:#eaeef6; --ink:#151a2b; --muted:#5d6681; --line:#dde2ee;

  --k-formula:#2f4fd8; --k-definition:#7a3fc4; --k-theorem:#0f7c86; --k-rule:#b4521b; --k-fact:#8a6a00; --k-text:#3f4a66;

  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1220; --surface:#171c2e; --sunk:#111627; --ink:#e8ebf5; --muted:#9aa3bf; --line:#2a3150;
  --accent:#7d93ff; --accent-ink:#0e1220; --accent-soft:#232c55;
  --mark:#e8c53a; --mark-ink:#0e1220;
  --good:#52d08f; --good-soft:#123826; --bad:#ff7d72; --bad-soft:#40191a; --warn:#f0b54a; --warn-soft:#3a2b0e;
  --k-formula:#8fa2ff; --k-definition:#c39bff; --k-theorem:#4fd2dc; --k-rule:#ff9d66; --k-fact:#e8c53a; --k-text:#aab3cf;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1220; --surface:#171c2e; --sunk:#111627; --ink:#e8ebf5; --muted:#9aa3bf; --line:#2a3150;
  --accent:#7d93ff; --accent-ink:#0e1220; --accent-soft:#232c55;
  --mark:#e8c53a; --mark-ink:#0e1220;
  --good:#52d08f; --good-soft:#123826; --bad:#ff7d72; --bad-soft:#40191a; --warn:#f0b54a; --warn-soft:#3a2b0e;
  --k-formula:#8fa2ff; --k-definition:#c39bff; --k-theorem:#4fd2dc; --k-rule:#ff9d66; --k-fact:#e8c53a; --k-text:#aab3cf;

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 72px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.85rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.6em 1.1em;font-weight:700;display:inline-flex;align-items:center;gap:.45em;justify-content:center;min-height:44px;transition:transform .08s, background .15s}
button:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

button.big{width:100%;font-size:1.05rem;min-height:52px}
button:disabled{opacity:.45;cursor:default}
button.icon{padding:.5em;width:44px;border-radius:50%}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input[type=text],input[type=search],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.7em .85em;width:100%}
textarea{resize:vertical;min-height:110px;line-height:1.5}
svg{width:1.15em;height:1.15em;flex:none}

.top{display:flex;align-items:center;gap:6px;padding-block:6px 14px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand i{display:inline-block;width:22px;height:8px;background:var(--mark);border-radius:2px;transform:skewX(-12deg);flex:none}

.hero{padding-block:4px 16px}
.hero p{max-width:52ch;margin-top:8px}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.goal{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted)}
.goal .bar{flex:1}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good>span{background:var(--good)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}

.chip.warn{background:var(--warn-soft);color:var(--warn)}

.kind.formula{color:var(--k-formula)} .kind.definition{color:var(--k-definition)} .kind.theorem{color:var(--k-theorem)} .kind.rule{color:var(--k-rule)} .kind.fact{color:var(--k-fact)} .kind.text{color:var(--k-text)}
.review-banner{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.subjects{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin-inline:-2px}
.subjects::-webkit-scrollbar{display:none}
.subjects button{min-height:38px;padding:.35em .95em;white-space:nowrap;font-weight:700}
.subjects button .n{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.subjects button.on .n{color:inherit}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions button{flex-direction:column;gap:2px;border-radius:var(--r);min-height:70px;padding:.5em}
.actions button small{font-weight:400;color:var(--muted);font-size:.75rem}

.textcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.textcard .title{font-family:var(--f-display);font-weight:700;font-size:1.08rem;overflow-wrap:anywhere;min-width:0}
.textcard .snip{color:var(--muted);font-size:.92rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.itemrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start;text-align:left;width:100%;font-weight:400;cursor:pointer;justify-items:start}
.itemrow .term{font-family:var(--f-display);font-weight:700;font-size:1.02rem;overflow-wrap:anywhere;min-width:0}
.itemrow .content{grid-column:1 / -1;color:var(--muted);font-size:.92rem;overflow-wrap:anywhere;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.itemrow .meta{display:flex;gap:6px;align-items:center}
.pips{display:inline-flex;gap:2px}
.pips i{width:5px;height:12px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--good)}
.fx{font-family:var(--f-mono);font-weight:500;letter-spacing:-.01em}
.fx sup,.fx sub{font-size:.7em;line-height:0}
.sheetgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sheetgrid>*{min-width:0}

.dropzone{border:2px dashed var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;background:var(--surface)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);flex-wrap:wrap}

.seg button.on{background:var(--accent);color:var(--accent-ink)}
.preview{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.preview div{display:flex;gap:10px;font-size:.92rem}
.preview div span:first-child{color:var(--muted);font-family:var(--f-mono);font-size:.78rem;min-width:2.2em;padding-top:2px}
.thumb{max-height:160px;border-radius:10px;border:1px solid var(--line)}
.symbols{display:flex;flex-wrap:wrap;gap:4px}
.symbols button{min-height:36px;min-width:38px;padding:.2em .5em;border-radius:8px;font-family:var(--f-mono);font-weight:500}
.fxpreview{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:1.15rem;min-height:2.4em;overflow-x:auto}
.field{display:flex;flex-direction:column;gap:6px}

.progress-dots{display:flex;gap:3px;flex-wrap:wrap}
.progress-dots span{flex:1 1 6px;min-width:6px;max-width:28px;height:6px;border-radius:9px;background:var(--line)}
.progress-dots span.done{background:var(--good)}
.progress-dots span.cur{background:var(--accent)}
.ladder{display:flex;gap:6px;flex-wrap:wrap}
.ladder span{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.ladder span.done{background:var(--good-soft);border-color:transparent;color:var(--good)}
.ladder span.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 0 var(--line), 0 12px 30px -18px rgba(20,30,70,.25)}
.cue{color:var(--muted);font-style:italic;font-size:.95rem;border-left:3px solid var(--line);padding-left:10px;overflow-wrap:anywhere}
.sentence{font-size:1.3rem;line-height:1.6;overflow-wrap:anywhere}
.sentence .hid{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 .15em;font-family:var(--f-mono);font-size:.9em;letter-spacing:.05em}
.sentence.blind{color:var(--muted);line-height:1.9}
.blindbar{display:inline-block;height:.9em;border-radius:4px;background:var(--line);vertical-align:middle;margin:0 .12em}
.front{font-family:var(--f-display);font-weight:700;font-size:1.55rem;line-height:1.25;overflow-wrap:anywhere;text-wrap:balance}
.back{font-size:1.2rem;line-height:1.55;overflow-wrap:anywhere;border-top:1px dashed var(--line);padding-top:14px}
.back.fx{font-size:1.3rem}
.note{font-size:.92rem;color:var(--muted);overflow-wrap:anywhere}
.answer{font-size:1.1rem;min-height:90px}
.feedback{border-radius:12px;padding:12px 14px;font-size:1.05rem;line-height:1.7;overflow-wrap:anywhere}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback .t{font-weight:700;font-family:var(--f-display);margin-bottom:4px}
.d-ok{color:var(--good)}
.d-miss{color:var(--warn);text-decoration:underline wavy;text-underline-offset:4px;font-weight:700}
.d-wrong{color:var(--bad);text-decoration:line-through}
.d-fix{color:var(--good);font-weight:700}
.d-extra{color:var(--bad);text-decoration:line-through;opacity:.75}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grades button{border-radius:12px;flex-direction:column;gap:0;padding:.4em .2em;min-height:56px}
.grades button small{font-weight:400;font-size:.72rem;color:var(--muted)}
.grades .again{border-color:var(--bad);color:var(--bad)}
.grades .good{border-color:var(--good);color:var(--good)}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{justify-content:flex-start;text-align:left;border-radius:12px;font-weight:400;padding:.75em 1em;overflow-wrap:anywhere;min-width:0}
.choices button.right{background:var(--good-soft);border-color:var(--good)}
.choices button.wrongpick{background:var(--bad-soft);border-color:var(--bad)}
.mic-live{color:var(--bad)!important}
.mic-live svg{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}

.fl{font-size:1.25rem;line-height:2;overflow-wrap:anywhere}
.fl .w{display:inline-block;margin-right:.35em}
.fl .w.todo{font-family:var(--f-mono);color:transparent;background:var(--line);border-radius:5px;line-height:1.3;user-select:none}
.fl .w.next{outline:2px solid var(--accent);outline-offset:1px}
.fl .w.slip{color:var(--bad)}
.flinput{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.fltap{width:100%;min-height:54px;border-style:dashed}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.built{min-height:52px;padding:10px;border-radius:12px;background:var(--sunk);font-size:1.15rem;line-height:1.7;overflow-wrap:anywhere}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool button{border-radius:10px;min-height:44px;font-weight:400;font-size:1.02rem}
.pool button.used{visibility:hidden}

.celebrate{text-align:center;padding:28px 12px}
.celebrate .num{font-family:var(--f-display);font-weight:800;font-size:3.4rem;color:var(--accent);line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;width:max-content;max-width:calc(100% - 32px);text-align:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
details summary{cursor:pointer;font-weight:700}
.empty{text-align:center;padding:24px;border:2px dashed var(--line);border-radius:var(--r)}
.pack{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.pack ul{margin:0;padding-left:1.1em;color:var(--muted);font-size:.9rem}
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{border-radius:3px;background:var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--good) 35%,var(--line))}
.heat i.l2{background:color-mix(in srgb,var(--good) 65%,var(--line))}
.heat i.l3{background:var(--good)}
.scanrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
input[type=checkbox]{accent-color:var(--accent);width:20px;height:20px;flex:none}
.more{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:-6px -2px 14px;scrollbar-width:none}
.more::-webkit-scrollbar{display:none}
.more button{min-height:38px;padding:.35em .9em;white-space:nowrap;font-size:.9rem}
.examcard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.examcard .count{text-align:center;line-height:1}
.examcard .count b{display:block;font-family:var(--f-display);font-weight:800;font-size:2rem;color:var(--accent);font-variant-numeric:tabular-nums}
.examcard .count span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.examcard.soon .count b{color:var(--bad)}
.gapline{font-size:1.2rem;line-height:2.1;overflow-wrap:anywhere}
.gapline.fx{font-size:1.25rem}
input.gap{display:inline-block;width:auto;padding:.05em .35em;margin:0 .1em;border-radius:7px;border:1.5px dashed var(--accent);background:var(--accent-soft);font:inherit;line-height:1.3;color:var(--ink);max-width:100%}
input.gap.ok{border-style:solid;border-color:var(--good);background:var(--good-soft)}
input.gap.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.match button{border-radius:12px;font-weight:400;min-height:68px;text-align:left;justify-content:flex-start;padding:.5em .7em;font-size:.92rem;min-width:0;width:100%}
.match button>span{overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.match .col:first-child button{font-weight:700;font-family:var(--f-display)}
.match button.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.match button.done{visibility:hidden}
.sheetrow{display:grid;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.sheetrow:last-child{border-bottom:0}
.sheetrow b{font-family:var(--f-display)}
.sheetrow button{justify-self:start;min-height:34px;padding:.2em .8em;font-size:.85rem}
.pill{min-height:34px;padding:.2em .8em;font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--accent);border-color:transparent}
.bigtime{font-family:var(--f-display);font-weight:800;font-size:clamp(4rem,22vw,7rem);line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.phase{text-align:center;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:.8rem}
.testrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:.9rem;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.testrow:last-child{border-bottom:0}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

function chunk(body, mode){

  if (mode === "line") return clean.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  if (mode === "paragraph") return clean.split(/\n\s*\n+/).map(s=>s.replace(/\s*\n\s*/g," ").trim()).filter(Boolean);
  const flat = clean.split(/\n\s*\n+/).map(p=>p.replace(/-\n(?=\p{Ll})/gu,"").replace(/\s*\n\s*/g," "));
  let out = [];
  for (const p of flat){
    let parts;
    if (typeof Intl !== "undefined" && Intl.Segmenter) parts = [...new Intl.Segmenter(undefined,{granularity:"sentence"}).segment(p)].map(s=>s.segment.trim());
    else parts = p.match(/[^.!?…]+[.!?…]+["')\]»”]*|[^.!?…]+$/g) || [p];
    out.push(...parts.filter(Boolean));
  }
  const lim = mode === "short" ? 12 : 24, res = [];
  for (const s of out){
    if (s.split(/\s+/).length > lim){
      let cur = "";
      for (const piece of s.split(/(?<=[,;:—–])\s+/)){
        if (cur && (cur+" "+piece).split(/\s+/).length > lim){ res.push(cur); cur = piece; }
        else cur = cur ? cur+" "+piece : piece;
      }
      if (cur) res.push(cur);
    } else res.push(s);
  }
  return res;
}

/* ================= comparing answers ================= */
const norm = w => w.toLocaleLowerCase().normalize("NFD").replace(/\p{M}/gu,"").replace(/[^\p{L}\p{N}]/gu,"");
const words = s => s.split(/\s+/).filter(w => norm(w));
function lev(a,b){ if(a===b) return 0; const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n]; }
function same(a,b){ if (a===b) return true; if (S.settings.strict) return false; return a.length>=5 && lev(a,b)<=1; }
function diff(target, answer){
  const T = words(target), A = words(answer), t=T.map(norm), a=A.map(norm);
  const m=t.length, n=a.length, L=Array.from({length:m+1},()=>new Int16Array(n+1));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) L[i][j] = same(t[i],a[j]) ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  const ops=[]; let i=0,j=0;
  while(i<m && j<n){
    if (same(t[i],a[j])) { ops.push({k:"ok", w:T[i]}); i++; j++; }
    else if (L[i+1][j] >= L[i][j+1]) { ops.push({k:"miss", w:T[i]}); i++; }
    else { ops.push({k:"extra", w:A[j]}); j++; }
  }
  while(i<m) ops.push({k:"miss", w:T[i++]});
  while(j<n) ops.push({k:"extra", w:A[j++]});
  const merged=[];
  for (let k=0;k<ops.length;k++){
    const o=ops[k], nx=ops[k+1];
    if (nx && ((o.k==="extra"&&nx.k==="miss")||(o.k==="miss"&&nx.k==="extra"))){ merged.push({k:"wrong", w:o.k==="miss"?o.w:nx.w, got:o.k==="extra"?o.w:nx.w}); k++; }
    else merged.push(o);
  }
  const ok = merged.filter(o=>o.k==="ok").length;
  return { ops:merged, ok, total:m, pass: ok===m && merged.every(o=>o.k==="ok") };
}
function renderDiff(d){
  const p = h("div");
  d.ops.forEach((o,ix)=>{
    if (ix) p.append(" ");
    if (o.k==="ok") p.append(h("span",{class:"d-ok"},o.w));
    else if (o.k==="miss") p.append(h("span",{class:"d-miss",title:"You left this out"},o.w));
    else if (o.k==="extra") p.append(h("span",{class:"d-extra",title:"Not in the text"},o.w));
    else p.append(h("span",{class:"d-wrong"},o.got)," ",h("span",{class:"d-fix"},o.w));
  });
  return p;
}
// Cards: formulas compare symbol by symbol (spaces and × · ignored); definitions allow small wording slips
function judge(target, answer, kind){
  if (kind==="formula" || looksLikeFormula(target)){
    const a = normF(target), b = normF(answer);
    if (a===b || (!S.settings.strict && a.toLowerCase()===b.toLowerCase())) return {pass:true, formula:true};
    const d = diff(target, answer);
    return {pass:d.pass, formula:true, d};
  }
  const d = diff(target, answer);
  if (d.pass) return {pass:true, d};
  const extras = d.ops.filter(o=>o.k==="extra").length;
  const close = !S.settings.strict && d.total>=6 && d.ok/d.total >= 0.85 && extras <= 2;
  return {pass:close, close, d};
}

/* ================= photos ================= */
async function shrink(file, maxSide=1800, maxBytes=3.5e6){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    let scale = Math.min(1, maxSide/Math.max(img.naturalWidth, img.naturalHeight));
    for (let q=0.88; ; q-=0.12){
      const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*scale); c.height=Math.round(img.naturalHeight*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const blob = await new Promise(r=>c.toBlob(r,"image/jpeg",q));
      if (blob.size<=maxBytes || q<0.4) return blob;
      if (q<0.6) scale*=0.8;
    }
  } finally { URL.revokeObjectURL(url); }
}
let tessPromise;
function loadTesseract(){
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  return tessPromise ||= new Promise((res,rej)=>{
    const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload=()=>res(window.Tesseract); s.onerror=()=>{tessPromise=null; rej(new Error("load"));}; document.head.append(s);
  });
}
const userErr = m => Object.assign(new Error(m),{user:true});
async function readPhoto(file, langCode, onStatus){
  const blob = await shrink(file, 1800, Math.min(3.5e6, caps.images?.maxFileBytes || 3.5e6));
  if (canScan()){
    onStatus("Claude is reading your photo…");
    try{
      const {text} = await caps.sample(
        "The attached image is a photo of text that the user wants to memorize. Transcribe ALL of the readable text exactly as written, in its original language, keeping line breaks and paragraph breaks. Write math with plain characters: ^ for powers, _ for subscripts, √, π, ≤, ≥. Fix only obvious hyphenation at line ends. Do not translate, summarize or add commentary. If there is no readable text, answer with exactly: NO_TEXT",
        { images:[blob], modelTier:"default" });
      const t = text.trim();
      if (t === "NO_TEXT") throw userErr("No readable text found in that photo.");
      return t;
    } catch(e){
      if (e.user) throw e;
      onStatus(e.code === "not_granted" ? "Claude access was declined. Trying the on-device reader…" : "Claude couldn't read it. Trying the on-device reader…");
    }
  }
  if (NATIVE){
    onStatus("Reading text…");
    try{
      const t = String(await nativeCall("ocr", await blobToB64(blob))).trim();
      if (!t) throw userErr("No readable text found in that photo. Try a closer, sharper shot.");
      return t;
    } catch(e){ if (e.user) throw e; throw userErr("Couldn't read the photo. Try again with more light, or type the text."); }
  }
  onStatus("Loading the text reader (the first time takes a moment)…");
  let T;
  try { T = await loadTesseract(); } catch { throw userErr("The photo reader couldn't load. Check your connection, or type the text instead."); }
  try{
    const r = await T.recognize(blob, lang(langCode).tess, { logger: m => { if (m.status==="recognizing text") onStatus(`Reading text… ${Math.round(m.progress*100)}%`); } });
    const t = (r.data.text||"").trim();
    if (!t) throw userErr("No readable text found in that photo.");
    return t;
  } catch(e){ if (e.user) throw e; throw userErr("The photo reader couldn't run here. Type or paste the text instead."); }
}

function speak(text, langCode){
  const rate = S.settings.rate;
  if (NATIVE){ NATIVE.speak(text, lang(langCode).bcp, rate); return; }
  if (caps.tts && langCode === "en"){ caps.tts.speak(text,{rate, language:"en"}).catch(()=>speakLocal(text, langCode, rate)); return; }
  speakLocal(text, langCode, rate);
}
function speakLocal(text, langCode, rate){
  if (!("speechSynthesis" in window)){
    if (caps.tts){ caps.tts.speak(text,{rate}).catch(()=>toast("Reading aloud isn't available here.")); return; }
    toast("Reading aloud isn't available in this browser."); return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = lang(langCode).bcp; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v=>v.lang?.toLowerCase().startsWith(langCode)); if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const micAvailable = () => !!(NATIVE || caps.dictation || SR);
let micStop = null;
function startMic(langCode, onText, onState){
  if (micStop){ micStop(); return; }
  if (NATIVE){
    let finals = "";
    window.__nativeMic = (type, text) => {
      if (type==="partial") onText((finals+" "+text).trim());
      else if (type==="final"){ finals = (finals+" "+text).trim(); onText(finals); }
      else if (type==="end"){ micStop=null; window.__nativeMic=null; onState(false); }
      else if (type==="error"){ micStop=null; window.__nativeMic=null; onState(false); if (text) toast(text); }
    };
    micStop = () => NATIVE.stopListening();
    onState(true); NATIVE.listen(lang(langCode).bcp);
    return;
  }
  if (caps.dictation){
    const d = caps.dictation; let finalText = ""; const offs = [];
    const off = () => offs.forEach(f=>{try{f()}catch{}});
    offs.push(d.onPartial(({text}) => onText((finalText+" "+text).trim())));
    offs.push(d.onFinal(({text}) => { finalText = (finalText+" "+text).trim(); onText(finalText); }));
    offs.push(d.onState(({state}) => { if (state==="idle"){ off(); micStop=null; onState(false);} else onState(true); }));
    micStop = () => d.stop().catch(()=>{});
    d.start({language: langCode}).catch(e => {
      off(); micStop=null; onState(false);
      if (e?.code==="not_granted") toast("Microphone was declined. You can type instead.");
      else if (e?.code!=="stopped") toast("Couldn't start the microphone here.");
    });
    return;
  }
  if (!SR){ toast("Speaking isn't supported in this browser. Try Chrome."); return; }
  const r = new SR(); r.lang = lang(langCode).bcp; r.interimResults = true; r.continuous = true;
  let finals = "";
  r.onresult = e => { let interim=""; for (let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if (e.results[i].isFinal) finals += " "+t; else interim += " "+t; } onText((finals+interim).trim()); };
  r.onend = () => { micStop=null; onState(false); };
  r.onerror = e => { if (e.error==="not-allowed") toast("Microphone was blocked. You can type instead."); };
  micStop = () => r.stop();
  try { r.start(); onState(true); } catch { micStop=null; toast("Couldn't start the microphone."); }
}
const stopMic = () => { if (micStop) micStop(); };

const BOX_DAYS = [0,1,3,7,14,30,60];
const lineCard = (it,i) => it.cards[i] ||= {box:0, due:0};

function gradeCard(it, g){ // 0 again, 1 hard, 2 good, 3 easy
  const c = it.card;
  if (g===0){ c.box = c.box ? 1 : 0; c.lapses = (c.lapses||0) + 1; }
  else if (g===1) c.box = Math.max(1, c.box);
  else c.box = Math.min(6, Math.max(1, c.box + (g===3?2:1)));
  c.due = c.box ? addDays(g<=1 ? 1 : BOX_DAYS[c.box]) : 0;
  if (g>0) bumpDay();

}

/* ================= ADD / EDIT TEXT ================= */
VIEWS.addtext = function(){
  const editing = view.edit ? S.items.find(t=>t.id===view.edit) : null;
  const st = view.draft ||= { title: editing?.title || "", body: editing?.body || "", lang: editing?.lang || S.settings.lang, split: editing?.split || "sentence",
    subjectId: editing?.subjectId || (S.settings.subject!=="all"?S.settings.subject:subjectByName(S,"General").id), status:"", busy:false, confirmDel:false };
  $app.append(topbar(editing ? "Edit text" : "Add a text", {to: editing?{name:"home"}:{name:"addmenu"}}));
  const body = h("textarea",{id:"body",placeholder:"Paste or type the text you want to learn…",rows:9}); body.value = st.body;
  const title = h("input",{type:"text",id:"title",placeholder:"e.g. Biology ch. 3, a poem"}); title.value = st.title;
  const status = h("p",{class:"small muted","aria-live":"polite"}, st.status);
  const preview = h("div",{class:"preview"});
  const count = h("span",{class:"label"});
  const saveBtn = B(editing?"Save changes":"Save and start learning",()=>doSave(),"primary big","check");

    const ch = chunk(body.value, st.split);
    preview.replaceChildren(...(ch.length ? ch.slice(0,80).map((c,i)=>h("div",null,h("span",null,String(i+1).padStart(2,"0")),h("span",null,c))) : [h("p",{class:"muted small"},"Your steps will show up here.")]));

  const thumb = h("img",{class:"thumb",alt:"Your photo",hidden:true});
  const camBtn = B("Take a photo",()=>file.click(),"primary","cam");
  async function handle(f){
    if (!f || !f.type.startsWith("image/")){ toast("That isn't an image."); return; }
    st.busy=true; saveBtn.disabled=true; camBtn.disabled=true;
    const setS = m => { st.status=m; status.textContent=m; };
    if (thumb.src) URL.revokeObjectURL(thumb.src);

    try{
      const text = await readPhoto(f, st.lang, setS);
      body.value = (body.value.trim() ? body.value.trim()+"\n\n" : "") + text; st.body = body.value;
      setS("Done. Check the text below and fix anything that was misread.");

    } catch(e){ setS(e.message || "Couldn't read the photo. Type or paste the text instead."); }
    st.busy=false; camBtn.disabled=false; refresh();

  const fileAny = h("input",{type:"file",accept:"image/*",hidden:true,id:"photo2"});

  fileAny.addEventListener("change",()=>{handle(fileAny.files[0]); fileAny.value="";});
  const zone = h("div",{class:"dropzone"},
    h("h3",null,"Photo of a page"),
    h("p",{class:"small muted"},"Book, notes, worksheet or screenshot. The text is copied for you, then you can fix it."),
    h("div",{class:"row",style:"justify-content:center"}, camBtn, B("Choose image",()=>fileAny.click(),"","plus")),
    thumb, file, fileAny);
  zone.addEventListener("dragover",e=>{e.preventDefault(); zone.classList.add("drag");});
  zone.addEventListener("dragleave",()=>zone.classList.remove("drag"));
  zone.addEventListener("drop",e=>{e.preventDefault(); zone.classList.remove("drag"); handle(e.dataTransfer.files[0]);});
  body.addEventListener("paste",e=>{ const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith("image/")); if (f){ e.preventDefault(); handle(f); } });

  const seg = h("div",{class:"seg",role:"group","aria-label":"Split into"});
  [["short","Short bits"],["sentence","Sentences"],["line","Lines"],["paragraph","Paragraphs"]].forEach(([k,l])=>{
    const b=B(l,()=>{ st.split=k; [...seg.children].forEach(c=>c.classList.toggle("on",c===b)); refresh(); }, st.split===k?"on":""); seg.append(b);
  });
  function doSave(){
    const ch = chunk(body.value, st.split); if (!ch.length) return;
    const name = title.value.trim() || body.value.trim().split(/\s+/).slice(0,5).join(" ");
    if (editing){
      const changed = editing.body!==body.value || editing.split!==st.split;
      Object.assign(editing,{title:name, body:body.value, lang:st.lang, split:st.split, subjectId:st.subjectId});
      if (changed){ editing.chunks = ch; editing.cards={}; editing.pos=0; }
      save(); view.draft=null; toast(changed?"Saved. Progress was reset because the text changed.":"Saved."); go({name:"home"});
    } else {
      const t = makeItem({kind:"text", title:name, body:body.value, lang:st.lang, split:st.split, subjectId:st.subjectId});
      S.items.unshift(t); save(); view.draft=null; startStudy(t,0);
    }
  }
  $app.append(h("div",{class:"stack"},
    zone,
    h("div",{class:"spread"},h("span",{class:"label"},"Language"),h("div",{style:"max-width:200px;flex:1"},langSelect("lang",st.lang,v=>st.lang=v))),
    status,
    h("label",{class:"label",for:"body"},"The text"), body,
    h("div",{class:"sheetgrid"},
      h("div",{class:"field"},h("label",{class:"label",for:"title"},"Name"), title),
      h("div",{class:"field"},h("label",{class:"label",for:"subj"},"Subject"), h("div",null,subjectSelect("subj",st.subjectId,v=>st.subjectId=v)))),
    h("div",{class:"spread"},h("span",{class:"label"},"Split into"),seg),
    h("div",{class:"spread"},count,h("span",{class:"small muted"},"Each step is one thing to learn.")),
    preview, saveBtn,

/* ================= SCAN NOTES (Claude) ================= */
VIEWS.scan = function(){

    if (!f) return;

    st.busy = true; st.status = "Claude is reading your notes… this can take up to a minute."; render();
    try{
      const blob = await shrink(f, 1800, Math.min(3.5e6, caps.images?.maxFileBytes||3.5e6));
      const out = await caps.sample.json(
`The attached image is a photo of a student's notes or a textbook page. Extract every formula, definition, theorem, rule and key fact a student should memorize.
Return ONLY a JSON array. Each element: {"kind": "formula"|"definition"|"theorem"|"rule"|"fact", "term": short name or question, "content": the formula, definition, statement or answer, "note": short context or ""}.
Keep the original language of the page (do not translate). Write math with plain characters: ^ for powers, _ for subscripts, √, π, Δ, ≤, ≥, ·. Use braces for multi-character exponents, e.g. x^{n-1}. Copy wording faithfully. If nothing is found return [].`,
        { images:[blob], modelTier:"default" });

      st.found = arr; st.status = arr.length ? `Found ${plural(arr.length,"card")}. Untick any you don't want, then save.` : "Nothing to memorize was found in that photo.";
    } catch(e){
      st.status = e?.code==="not_granted" ? "Claude access was declined, so scanning is off. You can add cards by hand." : e?.code==="rate_limited" ? "Too many requests right now. Wait a minute and try again." : "Couldn't scan that photo. Try a sharper, closer shot.";
    }

  }
  file.addEventListener("change",()=>{handle(file.files[0]); file.value="";});
  fileAny.addEventListener("change",()=>{handle(fileAny.files[0]); fileAny.value="";});
  $app.append(h("div",{class:"stack"},
    h("div",{class:"dropzone"},
      h("h3",null,"Photo of your notes"),
      h("p",{class:"small muted"},"Claude finds the formulas, definitions, theorems and rules and turns each into a card."),
      h("div",{class:"row",style:"justify-content:center"},B("Take a photo",()=>file.click(),"primary","cam",{disabled:st.busy||null}),B("Choose image",()=>fileAny.click(),"","plus",{disabled:st.busy||null})),
      file, fileAny),
    h("p",{class:"small muted","aria-live":"polite"},st.status)));
  if (st.found?.length){
    const list = h("div",{class:"stack"});
    st.found.forEach(x=>{
      const cb = h("input",{type:"checkbox","aria-label":"Keep "+x.term}); cb.checked = x.keep; cb.addEventListener("change",()=>x.keep=cb.checked);
      list.append(h("label",{class:"scanrow"},cb,h("div",{class:"stack",style:"gap:4px;min-width:0"},
        h("div",{class:"row"},h("span",{class:"kind "+x.kind},KINDS[x.kind].name),h("b",{style:"overflow-wrap:anywhere"},x.term)),
        h("div",{class:"small",style:"overflow-wrap:anywhere"}, x.kind==="formula"||looksLikeFormula(x.content) ? fx(x.content) : x.content))));
    });
    $app.append(h("div",{class:"stack",style:"margin-top:12px"},
      h("div",{class:"field"},h("label",{class:"label",for:"subj"},"Save into subject"),h("div",null,subjectSelect("subj",st.subjectId,v=>st.subjectId=v))),
      list,
      B("Save selected cards",()=>{
        const keep = st.found.filter(x=>x.keep);
        keep.forEach(x=>S.items.unshift(makeItem({...x, lang:S.settings.lang, subjectId:st.subjectId})));
        S.settings.subject = st.subjectId; save(); toast(`Saved ${plural(keep.length,"card")}.`); go({name:"home"});

/* ================= TEXT STUDY (ladder) ================= */
const METHODS = {
  ladder:  { name:"Ladder", desc:"Read and copy it, then half the words disappear, then type it with nothing showing.", stages:["copy","fade","blind"] },
  letters: { name:"First letters", desc:"Read it, then type just the first letter of each word while the words stay hidden.", stages:["copy","letters","blind"] },
  scramble:{ name:"Puzzle", desc:"Read it, put the shuffled words back in order, then type it from memory.", stages:["read","scramble","blind"] },
  speak:   { name:"Say it", desc:"Listen and read, then say it out loud from memory. Your microphone checks you.", stages:["listen","fadeSay","blindSay"] },
};
const STAGE_NAME = { copy:"Look & copy", read:"Read", listen:"Listen", fade:"Fade", fadeSay:"Fade", letters:"First letters", scramble:"Puzzle", blind:"From memory", blindSay:"From memory" };
function startStudy(t, from){
  if (!t.chunks.length){ toast("Nothing to learn in this one."); return; }
  if (from!=null) t.pos = from;
  else { let i=t.pos; while(i<t.chunks.length && lineCard(t,i).box) i++; t.pos = i<t.chunks.length ? i : 0; }
  save(); go({name:"study", id:t.id, stage:0, tries:0, chain:false});
}
VIEWS.study = function(){
  const t = S.items.find(x=>x.id===view.id); if (!t) return go({name:"home"});
  const m = METHODS[t.method], i = Math.min(t.pos, t.chunks.length-1), sent = t.chunks[i];
  const stages = m.stages, stageKey = view.chain ? "chain" : stages[view.stage];
  $app.append(topbar(t.kind==="text" ? t.title : t.term, {to: t.kind==="text"?{name:"home"}:{name:"item",id:t.id}}));
  const dots = h("div",{class:"progress-dots","aria-label":`Step ${i+1} of ${t.chunks.length}`});
  if (t.chunks.length<=60) t.chunks.forEach((_,k)=>dots.append(h("span",{class: k===i?"cur":(lineCard(t,k).box?"done":"")})));
  else dots.append(h("div",{class:"bar",style:"flex:1"},h("span",{style:`width:${Math.round(i/t.chunks.length*100)}%`})));
  const ladder = h("div",{class:"ladder"});
  stages.forEach((s,k)=>ladder.append(h("span",{class: !view.chain && k===view.stage?"cur":(k<view.stage||view.chain?"done":"")}, STAGE_NAME[s])));
  if (t.chain && i>0) ladder.append(h("span",{class:view.chain?"cur":""},"Chain"));
  const methodSel = h("select",{id:"method","aria-label":"Method"}, Object.entries(METHODS).map(([k,v])=>h("option",{value:k},v.name)));
  methodSel.value = t.method;
  methodSel.addEventListener("change",()=>{ t.method=methodSel.value; save(); go({...view, stage:0, tries:0, chain:false}); });
  $app.append(h("div",{class:"stack",style:"margin-bottom:14px"},
    h("div",{class:"spread"},h("span",{class:"label"},`Step ${i+1} of ${t.chunks.length}`),h("div",{style:"width:160px"},methodSel)),
    dots, ladder));
  const card = h("div",{class:"card"}); $app.append(card);
  const prev = i>0 ? t.chunks[i-1] : null;
  const passStage = () => {
    if (!view.chain && view.stage < stages.length-1) return go({...view, stage:view.stage+1, tries:0});
    if (!view.chain && t.chain && i>0) return go({...view, chain:true, tries:0});
    finishStep(t);
  };
  STAGES[stageKey]({t, sent, prev, card, passStage});
  const chainBox = h("input",{type:"checkbox",id:"chain"}); chainBox.checked=t.chain; chainBox.addEventListener("change",()=>{t.chain=chainBox.checked; save(); render();});
  $app.append(h("details",{class:"sheet",style:"margin-top:16px"},
    h("summary",null,"How this works"),
    h("p",{class:"small muted",style:"margin-top:8px"}, m.desc + (t.chain?" After each step you also recite the last few steps together, so they link up.":"")),
    h("div",{class:"row",style:"margin-top:10px"},
      h("label",{class:"row small",for:"chain"}, chainBox, "Chain steps together"),
      h("div",{class:"grow"}),
      B("Skip this step",()=>{ markLine(t,i); finishStep(t,true); },"ghost","skip"))));
};
const chainOf = t => t.chunks.slice(Math.max(0,t.pos-2), t.pos+1).join(" ");
function finishStep(t, skipped){
  if (!skipped){ markLine(t,t.pos); bumpDay(); }
  t.pos++;
  if (t.pos >= t.chunks.length){
    t.pos = 0;
    if (t.kind!=="text" && !t.card.box){ t.card.box = 1; t.card.due = addDays(1); }
    save(); go({name:"done", id:t.id}); return;
  }
  save(); toast(skipped ? "Skipped." : "Got it! Next line unlocked.");
  go({name:"study", id:t.id, stage:0, tries:0, chain:false});
}
function sentenceEl(text, mode){
  const el = h("div",{class:"sentence"+(mode==="blind"?" blind":"")});
  const ws = text.split(/\s+/);
  if (mode==="blind"){
    ws.forEach(w=>el.append(h("span",{class:"blindbar",style:`width:${Math.max(1,norm(w).length)*0.55}em`})));
    el.setAttribute("aria-label",`Hidden: ${ws.length} words`);
    return el;
  }
  ws.forEach((w,k)=>{
    if (k) el.append(" ");
    const hide = mode==="fade" && norm(w).length>1 && ((k*7+text.length)%5<3);
    if (hide){
      const m = w.match(/^([^\p{L}\p{N}]*)([\p{L}\p{N}])(.*?)([^\p{L}\p{N}]*)$/u);
      if (m){ el.append(m[1], h("span",{class:"hid"}, m[2] + "_".repeat(Math.max(1,m[3].length))), m[4]); return; }
    }
    el.append(w);
  });
  return el;
}
const listenBar = (t, text) => h("div",{class:"toolbar"}, B("Listen",()=>speak(text,t.lang),"","play"));

/* typed / spoken answer box */
function answerBox({t, target, card, onPass, mode, voiceFirst, kind, formula}){
  const ta = h("textarea",{class:"answer",id:"answer",placeholder: voiceFirst?"Tap the mic and say it… (or type)":"Type it here…",autocomplete:"off",autocapitalize:"sentences",spellcheck:"false",rows: formula?2:3, style: formula?"font-family:var(--f-mono);min-height:64px":null});
  const fb = h("div",{"aria-live":"polite"});
  const check = B("Check",()=>doCheck(),"primary","check");
  let micBtn = null;
  if ((micAvailable() || voiceFirst) && !formula){
    const idle = voiceFirst?"Say it":"Speak";
    micBtn = B(idle,()=>{
      if (!micAvailable()){ toast("Speaking isn't supported here. Type instead."); return; }
      startMic(t.lang, txt=>{ ta.value = txt; }, on=>{ micBtn.classList.toggle("mic-live",on); micBtn.querySelector("span").textContent = on?"Stop":idle; if(!on && ta.value.trim() && voiceFirst) doCheck(); });
    }, voiceFirst?"primary":"", "mic");
  }
  ta.addEventListener("keydown",e=>{ if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); doCheck(); } });
  let done = false;
  function pass(perfect){
    done = true; check.disabled = true; ta.disabled = true;
    const next = B("Next", ()=>onPass(perfect), "primary big", "check");
    card.append(next); next.focus({preventScroll:true});
    if (mode!=="final") setTimeout(()=>{ if (document.body.contains(next)) next.click(); }, 900);
  }
  function doCheck(){
    if (done) return;
    if (!ta.value.trim()){ ta.classList.add("shake"); setTimeout(()=>ta.classList.remove("shake"),300); ta.focus(); return; }
    stopMic();
    view.tries = (view.tries||0) + 1;
    const r = kind ? judge(target, ta.value, kind) : (()=>{ const d=diff(target, ta.value); return {pass:d.pass, d}; })();
    if (r.pass){
      fb.replaceChildren(h("div",{class:"feedback ok"},
        h("div",{class:"t"}, r.close ? "Close enough! The exact wording:" : (view.tries===1?"Perfect, first try!":"Correct!")),
        r.formula ? fx(target) : renderDiff(r.d)));
      pass(view.tries===1 && !r.close);
    } else {
      const d = r.d;
      const head = r.formula ? "Not quite. Compare with the correct formula:" : (d.total && d.ok/d.total>=0.7 ? `Close, ${d.ok} of ${d.total} words. Fix the marked ones.` : `${d.ok} of ${d.total} words. Try again.`);
      fb.replaceChildren(h("div",{class:"feedback no"},
        h("div",{class:"t"}, head),
        r.formula ? h("div",{class:"stack",style:"gap:4px"}, h("div",null,h("span",{class:"small muted"},"You wrote: "), fx(ta.value)), h("div",null,h("span",{class:"small muted"},"Correct: "), fx(target))) : renderDiff(d),
        !r.formula ? h("p",{class:"small muted",style:"margin-top:6px"},"Struck out: what you wrote. Green bold: the right word. Wavy: a word you left out.") : null,
        kind ? h("div",{class:"row",style:"margin-top:8px"}, B("I was right",()=>{ fb.replaceChildren(h("div",{class:"feedback ok"},h("div",{class:"t"},"Counted as right."))); pass(false); },"ghost","check")) : null));
      ta.select();
    }
  }
  card.append(ta);
  let symBtn = null;
  if (formula){
    const bar = symbolBar(ta); bar.hidden = true;
    symBtn = B("Symbols",()=>{ bar.hidden = !bar.hidden; symBtn.classList.toggle("on", !bar.hidden); },"", null, {"aria-expanded":"false"});
    symBtn.addEventListener("click",()=>symBtn.setAttribute("aria-expanded", String(!bar.hidden)));
    card.append(bar);
  }
  card.append(h("div",{class:"toolbar"}, micBtn, symBtn, h("div",{class:"grow"}), check), fb);
  setTimeout(()=>{ if(!voiceFirst) ta.focus({preventScroll:true}); },50);
}
function peekable(card, text){
  const holder = h("div");
  card.append(h("div",{class:"toolbar"},B("Peek (2 s)",()=>{ holder.replaceChildren(h("div",{class:"cue",style:"font-style:normal"},text)); setTimeout(()=>holder.replaceChildren(),2000); },"ghost","eye")), holder);
}
const cueEl = prev => prev ? h("div",{class:"cue"},"…"+prev) : null;
const STAGES = {
  copy({t, sent, prev, card, passStage}){
    card.append(h("span",{class:"label"},"Read it, then type it while looking")); if (prev) card.append(cueEl(prev));
    card.append(sentenceEl(sent,"full"), listenBar(t,sent));
    answerBox({t, target:sent, card, onPass:passStage});
  },
  read({t, sent, prev, card, passStage}){
    card.append(h("span",{class:"label"},"Read it two or three times, out loud if you can")); if (prev) card.append(cueEl(prev));
    card.append(sentenceEl(sent,"full"), listenBar(t,sent), B("I've read it",passStage,"primary big","check"));
  },
  listen({t, sent, prev, card, passStage}){
    card.append(h("span",{class:"label"},"Listen and repeat it out loud")); if (prev) card.append(cueEl(prev));
    card.append(sentenceEl(sent,"full"), listenBar(t,sent));
    answerBox({t, target:sent, card, onPass:passStage, voiceFirst:true});
    setTimeout(()=>speak(sent,t.lang),300);
  },
  fade({t, sent, prev, card, passStage}){
    card.append(h("span",{class:"label"},"Some words are hidden. Type the whole line")); if (prev) card.append(cueEl(prev));
    card.append(sentenceEl(sent,"fade"));
    answerBox({t, target:sent, card, onPass:passStage});
  },
  fadeSay({t, sent, prev, card, passStage}){
    card.append(h("span",{class:"label"},"Some words are hidden. Say the whole line")); if (prev) card.append(cueEl(prev));
    card.append(sentenceEl(sent,"fade"));
    answerBox({t, target:sent, card, onPass:passStage, voiceFirst:true});
  },
  blind(a){ blindStage(a,false); },
  blindSay(a){ blindStage(a,true); },
  chain({t, card, passStage}){
    const n = Math.min(3, t.pos+1), text = chainOf(t);
    card.append(h("span",{class:"label"},`Chain: the last ${n} steps together, from memory`));
    if (t.pos-n>=0) card.append(cueEl(t.chunks[t.pos-n]));
    card.append(sentenceEl(text,"blind"));
    peekable(card, text);
    answerBox({t, target:text, card, onPass:passStage, mode:"final", voiceFirst: t.method==="speak"});
  },
  letters({t, sent, prev, card, passStage}){
    card.append(h("span",{class:"label"},"Type the first letter of each word")); if (prev) card.append(cueEl(prev));
    const ws = sent.split(/\s+/).filter(w=>norm(w));
    const line = h("div",{class:"fl"});
    const spans = ws.map(w=>{ const s=h("span",{class:"w todo"},w); line.append(s); return s; });
    let k=0, slips=0;
    const inp = h("input",{class:"flinput",type:"text",id:"flinput",autocomplete:"off",autocapitalize:"none",autocorrect:"off",spellcheck:"false","aria-label":"Type first letters"});
    const info = h("p",{class:"small muted","aria-live":"polite"},"Tap below to bring up the keyboard.");
    const tap = B("Tap here and type",()=>inp.focus(),"fltap");
    const mark = () => spans.forEach((s,j)=>s.classList.toggle("next", j===k));
    function feed(ch){
      if (k>=ws.length) return;
      if (norm(ch)===norm(ws[k])[0]){ spans[k].classList.remove("todo","next"); k++; }
      else { slips++; const s=spans[k]; s.classList.add("shake"); setTimeout(()=>s.classList.remove("shake"),300);
        if (slips%3===0){ s.classList.remove("todo"); s.classList.add("slip"); k++; } }   // reveal after 3 misses so you're never stuck
      info.textContent = `${k} of ${ws.length} words · ${plural(slips,"slip")}`;
      mark();
      if (k>=ws.length){
        inp.blur(); tap.remove();
        const good = slips <= Math.max(1, Math.floor(ws.length/8));
        card.append(h("div",{class:"feedback "+(good?"ok":"no")},h("div",{class:"t"}, good?"Nice! On to the hard part.":`${plural(slips,"slip")}. Go once more for a cleaner run.`)));
        card.append(good ? B("Next",passStage,"primary big","check") : B("Again",()=>go({...view, tries:0}),"primary big","redo"));
      }
    }
    inp.addEventListener("input",()=>{ const v=inp.value; inp.value=""; for (const ch of v) if (norm(ch)) feed(ch); });
    card.append(line, info, tap, inp); mark();
    setTimeout(()=>inp.focus({preventScroll:true}),60);
  },
  scramble({t, sent, prev, card, passStage}){
    card.append(h("span",{class:"label"},"Tap the words in the right order")); if (prev) card.append(cueEl(prev));
    const ws = sent.split(/\s+/).filter(Boolean);
    const built = h("div",{class:"built"}), pool = h("div",{class:"pool"});
    let k=0, slips=0;
    let order = shuffle(ws.map((w,ix)=>({w,ix})));
    if (ws.length>1 && order.every((o,j)=>o.ix===j)) order.reverse();
    order.forEach(o=>{
      const b = h("button",{type:"button"}, o.w);
      b.addEventListener("click",()=>{
        if (k>=ws.length) return;
        if (norm(o.w)===norm(ws[k])){
          b.classList.add("used"); built.append((k?" ":""), ws[k]); k++;
          if (k>=ws.length) card.append(h("div",{class:"feedback ok"},h("div",{class:"t"}, slips? `Done with ${plural(slips,"slip")}.`:"Flawless!")), B("Next",passStage,"primary big","check"));
        } else { slips++; b.classList.add("shake"); setTimeout(()=>b.classList.remove("shake"),300); }
      });
      pool.append(b);
    });
    card.append(built, pool, listenBar(t,sent));
  },
};
function blindStage({t, sent, prev, card, passStage}, voice){
  card.append(h("span",{class:"label"}, voice?"Now say it with nothing showing":"Now write it with nothing showing")); if (prev) card.append(cueEl(prev));
  card.append(sentenceEl(sent,"blind"));
  peekable(card, sent);
  answerBox({t, target:sent, card, onPass:passStage, mode:"final", voiceFirst:voice});
}

/* ================= DONE ================= */
VIEWS.done = function(){
  const t = S.items.find(x=>x.id===view.id); if (!t) return go({name:"home"});
  $app.append(topbar(""));
  $app.append(h("div",{class:"card celebrate"},
    h("div",{class:"num"},t.chunks.length),
    h("h2",null,`You worked through all of “${t.kind==="text"?t.title:t.term}”`),
    h("p",{class:"muted"},"Now prove it: write the whole thing from memory. Or come back tomorrow for a review."),
    h("div",{class:"stack"},
      B("Full recall test",()=>go({name:"full", id:t.id, tries:0}),"primary big","spark"),
      B("Back home",()=>go({name:"home"}),"big"))));
};
VIEWS.full = function(){
  const t = S.items.find(x=>x.id===view.id); if (!t) return go({name:"home"});
  $app.append(topbar("Full recall"));
  const card = h("div",{class:"card"}); $app.append(card);
  const all = t.chunks.join(" ");
  card.append(h("span",{class:"label"},`All ${plural(t.chunks.length,"step")}, from memory`));
  if (t.kind!=="text") card.append(h("div",{class:"front"},t.term));
  peekable(card, all);
  answerBox({t, target:all, card, mode:"final", voiceFirst: t.method==="speak", onPass:()=>{
    for (const k in t.cards){ const c=t.cards[k]; c.box=Math.min(6,c.box+1); c.due=addDays(BOX_DAYS[c.box]); }
    bumpDay(); save(); toast("Memorized!"); go({name:"home"});
  }});
};

/* ================= CARD PRACTICE (flashcards / type / quiz) ================= */
const MODE_NAME = {flash:"Flashcards", type:"Type it", quiz:"Quiz", gaps:"Gaps"};
const fmtTime = secs => `${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}`;
function startDeck(cards, mode){
  if (!cards.length){ toast("Add a formula, definition or rule first."); return; }
  go({name:"deck", mode, ids: orderForPractice(cards).map(c=>c.id), k:0, right:0, missed:[], start:Date.now()});
}
function startTest(subjectId, n=15){
  const cards = S.items.filter(it=>it.kind!=="text" && (subjectId==="all"||it.subjectId===subjectId));
  if (cards.length<2){ toast("A practice test needs at least 2 cards in this subject."); return; }
  const ids = shuffle(cards).slice(0,n).map(c=>c.id);
  const modes = ids.map(()=>{ const r=Math.random(); return r<0.45?"quiz":r<0.75?"gaps":"type"; });
  go({name:"deck", mode:"mix", test:true, subjectId, ids, modes, k:0, right:0, missed:[], start:Date.now()});
}
VIEWS.deck = function(){
  const ids = view.ids.filter(id=>S.items.some(x=>x.id===id));
  $app.append(topbar(view.test ? "Practice test" : MODE_NAME[view.mode]));
  if (view.k >= ids.length) return deckEnd(ids);
  const it = S.items.find(x=>x.id===ids[view.k]);
  const mode = view.mode==="mix" ? view.modes[view.k] : view.mode;
  const head = h("div",{class:"spread"},h("span",{class:"label"},`${view.k+1} of ${ids.length}`));
  if (view.test) head.append(h("span",{class:"chip warn"},`${view.right} right so far`));
  else {
    const seg = h("div",{class:"seg",role:"group","aria-label":"Mode"});
    Object.entries(MODE_NAME).forEach(([k,l])=>seg.append(B(l,()=>go({...view, mode:k, tries:0}), view.mode===k?"on":"")));
    head.append(h("div",{style:"overflow-x:auto;max-width:100%"},seg));
  }
  $app.append(h("div",{class:"stack",style:"margin-bottom:14px"}, head, h("div",{class:"bar"},h("span",{style:`width:${view.k/ids.length*100}%`}))));
  const card = h("div",{class:"card"}); $app.append(card);
  const next = g => { gradeCard(it, g); go({...view, k:view.k+1, right:view.right+(g>=2?1:0), missed: g<2 ? [...(view.missed||[]), it.id] : (view.missed||[]), tries:0}); };
  ({flash:flashCard, type:typeCard, quiz:quizCard, gaps:gapsCard})[mode](it, card, next);
};
function deckEnd(ids){
  const secs = Math.round((Date.now()-(view.start||Date.now()))/1000);
  const pct = ids.length ? Math.round(view.right/ids.length*100) : 0;
  if (view.test && !view.saved){ view.saved = true; S.tests.push({date:Date.now(), subjectId:view.subjectId, score:view.right, total:ids.length, secs}); S.tests = S.tests.slice(-60); save(); }
  const missed = [...new Set(view.missed||[])].map(id=>S.items.find(x=>x.id===id)).filter(Boolean);
  const verdict = pct>=90 ? "Excellent!" : pct>=70 ? "Good work" : pct>=50 ? "Getting there" : "Keep practising";
  $app.append(h("div",{class:"card celebrate"},
    h("div",{class:"num"}, view.test ? pct+"%" : `${view.right}/${ids.length}`),
    h("h2",null, view.test ? verdict : (view.right===ids.length ? "All correct!" : "Round finished")),
    h("p",{class:"muted"}, `${view.right} of ${ids.length} right in ${fmtTime(secs)}.` + (view.test ? "" : " Missed cards come back sooner.")),
    h("div",{class:"stack"},
      missed.length ? B(missed.length===1?"Practise the one I missed":`Practise the ${missed.length} I missed`,()=>startDeck(missed,"flash"),"primary big","redo") : null,
      view.test ? B("Take another test",()=>startTest(view.subjectId),"big","spark") : (ids.length>1 ? B("Another round",()=>go({...view, ids:shuffle(ids), k:0, right:0, missed:[], start:Date.now(), tries:0}),"big","redo") : null),
      B("Back home",()=>go({name:"home"}),"big"))));
  if (missed.length) $app.append(h("div",{class:"sheet",style:"margin-top:14px"},h("h3",null,"Go over these again"),
    missed.map(it=>h("div",{class:"sheetrow"},h("b",null,it.term), isFx(it)?fx(it.content):h("span",{class:"muted"},it.content)))));
}
function gapsCard(it, card, next){
  cardHead(it, card, false);
  const f = isFx(it);
  const toks = it.content.split(/(\s+)/);
  const cand = toks.map((t,i)=>({t,i})).filter(o=>o.t.trim() && (f ? /[\p{L}\p{N}]/u.test(o.t) : (norm(o.t).length>=4 || /\d/.test(o.t))));
  if (!cand.length) return typeCard(it, card, next);
  const n = Math.max(1, Math.min(6, Math.round(cand.length*(f?0.4:0.3))));
  const hide = new Set(shuffle(cand).slice(0,n).map(o=>o.i));
  const line = h("div",{class:"gapline"+(f?" fx":"")});
  const inputs = [];
  toks.forEach((t,i)=>{
    if (hide.has(i)){
      const inp = h("input",{type:"text",class:"gap",autocomplete:"off",autocapitalize:"off",autocorrect:"off",spellcheck:"false","aria-label":"Missing part "+(inputs.length+1),style:`width:${Math.max(3,[...t].length+1)}ch`});
      inp.dataset.want = t; inputs.push(inp); line.append(inp);
    } else line.append(f ? fx(t,"") : t);
  });
  card.append(h("span",{class:"label"},"Fill in the missing parts"), line);
  const check = B("Check",()=>{
    let good = 0;
    inputs.forEach(inp=>{
      const w = inp.dataset.want, a = inp.value.trim();
      const ok = a && (f ? normF(w).toLowerCase()===normF(a).toLowerCase() : same(norm(w), norm(a)));
      inp.classList.add(ok?"ok":"bad"); inp.disabled = true;
      if (ok) good++; else { inp.value = a ? `${a} → ${w}` : w; inp.style.width = Math.max(3,[...inp.value].length+1)+"ch"; }
    });
    check.remove();
    const all = good===inputs.length;
    card.append(h("div",{class:"feedback "+(all?"ok":"no")},h("div",{class:"t"}, all ? "All right!" : `${good} of ${inputs.length} right. The red ones show the answer.`)),
      ...(all ? [] : [backEl(it)]),
      B("Next",()=>next(all?2:(good*2>=inputs.length?1:0)),"primary big","check"));
  },"primary big","check");
  inputs.forEach((inp,ix)=>inp.addEventListener("keydown",e=>{ if (e.key==="Enter"){ e.preventDefault(); if (ix<inputs.length-1) inputs[ix+1].focus(); else check.click(); } }));
  card.append(check);
  setTimeout(()=>inputs[0]?.focus({preventScroll:true}),60);
}
function cardHead(it, card, reverse){
  card.append(h("div",{class:"spread"},h("div",{class:"row"},h("span",{class:"kind "+it.kind},KINDS[it.kind].name),h("span",{class:"chip"},subj(it.subjectId).name)), pips(it.card.box)));
  if (reverse){
    card.append(h("span",{class:"label"},`Which ${KINDS[it.kind].front.toLowerCase()} is this?`));
    card.append(h("div",{class:"back"+(isFx(it)?" fx":""),style:"border:0;padding:0"}, isFx(it) ? fx(it.content) : it.content));
  } else {
    card.append(h("span",{class:"label"},`What's the ${KINDS[it.kind].back.toLowerCase()}?`));
    card.append(h("div",{class:"front"},it.term));
  }
}
function backEl(it){
  return h("div",{class:"stack",style:"gap:8px"},
    h("div",{class:"back"+(isFx(it)?" fx":"")}, isFx(it) ? fx(it.content) : it.content),
    it.note ? h("div",{class:"note"}, looksLikeFormula(it.note)?fx(it.note,""):it.note) : null);
}
function gradeBtn(label, cls, sub, fn){ const b=B(label,fn,cls); b.append(h("small",null,sub)); return b; }
function flashCard(it, card, next){
  cardHead(it, card, false);
  const reveal = B("Show answer",()=>{
    reveal.remove(); hint.remove();
    const d = n => n===1 ? "1 day" : n+" days";
    card.append(backEl(it),
      h("span",{class:"label"},"How well did you know it?"),
      h("div",{class:"grades"},
        gradeBtn("Again","again","soon",()=>next(0)),
        gradeBtn("Hard","","1 day",()=>next(1)),
        gradeBtn("Good","good",d(BOX_DAYS[Math.min(6,Math.max(1,it.card.box+1))]),()=>next(2)),
        gradeBtn("Easy","",d(BOX_DAYS[Math.min(6,Math.max(1,it.card.box+2))]),()=>next(3))));
  },"primary big","eye");
  const hint = h("p",{class:"small muted"},"Say or think the answer first, then check.");
  card.append(hint, reveal);
}
function typeCard(it, card, next){
  cardHead(it, card, false);
  answerBox({t:it, target:it.content, card, mode:"final", kind:it.kind, formula:isFx(it), onPass:perfect=>next(perfect?2:1)});
  const giveUp = B("Show answer",()=>{ giveUp.remove(); card.append(h("div",{class:"feedback no"},h("div",{class:"t"},"Here it is. It'll come back soon."),backEl(it)), B("Next",()=>next(0),"primary big","skip")); },"ghost","eye");
  card.append(giveUp);
}
function quizCard(it, card, next){
  const pool = S.items.filter(x=>x.kind!=="text" && x.id!==it.id);
  const sameKind = pool.filter(x=>x.kind===it.kind), sameSubj = sameKind.filter(x=>x.subjectId===it.subjectId);
  const distract = [...shuffle(sameSubj), ...shuffle(sameKind), ...shuffle(pool)]
    .filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i && x.content!==it.content && x.term!==it.term).slice(0,3);
  if (!distract.length){ card.append(h("p",{class:"muted small"},"The quiz needs at least two cards, so here's a flashcard.")); return flashCard(it, card, next); }
  const reverse = Math.random() < 0.35;
  cardHead(it, card, reverse);
  const opts = shuffle([it, ...distract]);
  const wrap = h("div",{class:"choices"});
  let answered = false;
  opts.forEach(o=>{
    const b = h("button",{type:"button"}, reverse ? o.term : (isFx(o) ? fx(o.content) : o.content));
    b.addEventListener("click",()=>{
      if (answered) return; answered = true;
      const ok = o.id===it.id;
      [...wrap.children].forEach((c,ix)=>{ if (opts[ix].id===it.id) c.classList.add("right"); });
      if (!ok) b.classList.add("wrongpick");
      card.append(h("div",{class:"feedback "+(ok?"ok":"no")},h("div",{class:"t"}, ok?"Correct!":"Not this time. The answer is highlighted."), !ok ? h("div",{class:"front",style:"font-size:1.1rem"},it.term) : null, !ok ? backEl(it) : null),
        B("Next",()=>next(ok?2:0),"primary big","check"));
    });
    wrap.append(b);
  });
  card.append(wrap);
}

/* ================= REVIEW (everything due) ================= */
VIEWS.review = function(){
  view.queue ||= shuffle(dueList()).slice(0,30);
  view.k ||= 0; view.right ||= 0;
  $app.append(topbar("Review"));
  if (view.k >= view.queue.length){
    $app.append(h("div",{class:"card celebrate"},
      h("div",{class:"num"},`${view.right}/${view.queue.length}`),
      h("h2",null, view.queue.length?"Review done":"Nothing to review right now"),
      h("p",{class:"muted"}, view.queue.length?"Things you got right come back later. Missed ones come back tomorrow.":"Learn something first. It shows up here when it's time to refresh it."),
      B("Back home",()=>go({name:"home"}),"primary big")));
    return;
  }
  const q = view.queue[view.k], it = S.items.find(x=>x.id===q.id);
  if (!it || (q.type==="line" && !it.chunks[q.i])){ view.k++; return render(); }
  $app.append(h("div",{class:"stack",style:"margin-bottom:14px"},
    h("div",{class:"spread"},h("span",{class:"label"},`${view.k+1} of ${view.queue.length}`),h("span",{class:"chip"},subj(it.subjectId).name)),

/* ================= PASTE A LIST ================= */
function parseBulk(text, kind){
  const rows = [];
  for (const raw of text.split(/\n/)){
    const l = raw.trim().replace(/^[-•*\d.)\s]+(?=\S)/, m => /\d/.test(m) && !/[.)]/.test(m) ? m : "");
    if (!l) continue;
    let pair = null;
    for (const sep of ["\t"," | "," — "," – "," - ",": "," = "]){
      const i = l.indexOf(sep);
      if (i>0){ pair = sep===" = " ? [l.slice(0,i).trim(), l.trim()] : [l.slice(0,i).trim(), l.slice(i+sep.length).trim()]; break; }
    }
    if (!pair || !pair[1]) continue;
    const [term, content] = pair;
    const k = kind!=="auto" ? kind : looksLikeFormula(content) ? "formula" : (/^\d{1,4}\b/.test(content) && content.split(/\s+/).length<=4) ? "fact" : content.split(/\s+/).length>5 ? "definition" : "fact";
    rows.push({kind:k, term, content});
  }
  return rows;
}

    const group = its.filter(it=>it.kind===k).sort((a,b)=>a.term.localeCompare(b.term));
    if (!group.length) continue;
    $app.append(h("div",{class:"sheet",style:"margin-bottom:12px"},
      h("div",{class:"spread",style:"margin-bottom:4px"},h("span",{class:"kind "+k},{formula:"Formulas",theorem:"Theorems",definition:"Definitions",rule:"Rules",fact:"Facts & dates"}[k]),h("span",{class:"small muted"},group.length)),
      group.map(it=>{
        const ans = () => h("div",null, isFx(it) ? fx(it.content) : it.content, it.note ? h("div",{class:"note"},it.note) : null);
        const row = h("div",{class:"sheetrow"}, h("b",null,it.term));
        if (view.hide){ const b = B("Show",()=>b.replaceWith(ans()),"","eye"); row.append(b); } else row.append(ans());
        return row;
      })));
  }
};

/* ================= FOCUS TIMER ================= */
const FOCUS_MIN = {work:25, rest:5};
const focus = {running:false, end:0, left:FOCUS_MIN.work*60000, phase:"work", ac:null};
const focusLeft = () => focus.running ? focus.end-Date.now() : focus.left;
const focusActive = () => focus.running || focus.left < FOCUS_MIN[focus.phase]*60000;
const focusFmt = ms => fmtTime(Math.max(0, Math.ceil(ms/1000)));
setInterval(()=>{
  if (focus.running && focusLeft()<=0){ focus.running=false; finishFocus(); }
  document.querySelectorAll("[data-focus]").forEach(el=>el.textContent=focusFmt(focusLeft()));
}, 500);
function beep(){
  try{
    const ac = focus.ac; if (!ac) return;
    [0,0.3,0.6].forEach(t=>{ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=880; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001,ac.currentTime+t); g.gain.exponentialRampToValueAtTime(0.3,ac.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+t+0.25);
      o.start(ac.currentTime+t); o.stop(ac.currentTime+t+0.27); });
  } catch {}
}
function finishFocus(){
  beep(); try { NATIVE?.vibrate ? NATIVE.vibrate(600) : navigator.vibrate?.([250,120,250]); } catch {}
  if (focus.phase==="work"){ S.stats.focus[today()] = (S.stats.focus[today()]||0)+1; save(); focus.phase="rest"; toast("Focus session done. Take a 5-minute break."); }
  else { focus.phase="work"; toast("Break's over. Ready for another round?"); }
  focus.left = FOCUS_MIN[focus.phase]*60000;
  if (view.name==="focus") render();
}
VIEWS.focus = function(){
  $app.append(topbar("Focus timer"));
  const toggle = () => {
    try { focus.ac ||= new (window.AudioContext||window.webkitAudioContext)(); focus.ac.resume?.(); } catch {}
    if (focus.running){ focus.left = focusLeft(); focus.running = false; } else { focus.end = Date.now()+focus.left; focus.running = true; }
    render();
  };
  const sessions = S.stats.focus[today()]||0;
  $app.append(h("div",{class:"card"},
    h("div",{class:"phase"}, focus.phase==="work" ? "Focus" : "Break"),
    h("div",{class:"bigtime","data-focus":"",role:"timer"}, focusFmt(focusLeft())),
    h("p",{class:"muted",style:"text-align:center"}, focus.phase==="work" ? "25 minutes of studying, then a 5-minute break. The timer keeps running while you practise." : "Stand up, drink some water, look away from the screen."),
    B(focus.running?"Pause":(focusActive()?"Resume":"Start"),toggle,"primary big", focus.running?null:"play"),
    h("div",{class:"row",style:"justify-content:center"},
      B("Reset",()=>{ focus.running=false; focus.left=FOCUS_MIN[focus.phase]*60000; render(); },"ghost","redo"),
      B(focus.phase==="work"?"Skip to break":"Skip break",()=>{ focus.running=false; focus.phase = focus.phase==="work"?"rest":"work"; focus.left=FOCUS_MIN[focus.phase]*60000; render(); },"ghost","skip")),
    h("p",{class:"small muted",style:"text-align:center"}, `Sessions today: ${sessions}`),
    focus.running ? B("Go practise while it runs",()=>go({name:"home"}),"big","cards") : null));
};

/* ================= SHARE A SUBJECT ================= */
async function shareSubject(subjectId){
  const s = subj(subjectId);
  const items = S.items.filter(i=>i.subjectId===subjectId).map(i=>({kind:i.kind, term:i.term, content:i.content, note:i.note, lang:i.lang, title:i.title, body:i.body, split:i.split}));
  if (!items.length){ toast("That subject is empty."); return; }
  const data = JSON.stringify({type:"linebyline-deck", v:1, subject:s.name, items});
  try { await saveFile(`${s.name.replace(/[^\p{L}\p{N}]+/gu,"-")}-cards.json`, data); } catch { toast("Couldn't share the file."); }
}
function importDeck(d){
  let sub = S.subjects.find(s=>s.name===d.subject); if (!sub){ sub={id:uid(), name:String(d.subject||"Shared").slice(0,60)}; S.subjects.push(sub); }
  const have = new Set(S.items.filter(i=>i.subjectId===sub.id).map(i=>i.kind+"|"+(i.term||i.title)));
  let n = 0;
  for (const x of d.items||[]){
    if (!x || !KINDS[x.kind] || have.has(x.kind+"|"+(x.term||x.title))) continue;
    S.items.push(makeItem({kind:x.kind, term:String(x.term||""), content:String(x.content||""), note:String(x.note||""), lang:x.lang, title:String(x.title||""), body:String(x.body||""), split:x.split, subjectId:sub.id})); n++;
  }
  save(); return {n, name:sub.name};
}

window.__onResume = () => { if (view.name==="home") render(); };
